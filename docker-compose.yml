services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: always
    ports:
      - "6682:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mit:Mit6666.@172.18.0.2:5432/robux_republic_db
    networks:
      - reseau_partage

  scheduler_finalize:
    build: ./
    container_name: scheduler_finalize
    command: python -m app.schelduler.finalize_transaction
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mit:Mit6666.@172.18.0.2:5432/robux_republic_db
    networks:
      - reseau_partage
    
  mail_send:
    build: ./
    container_name: mail_send
    command: python -m app.schelduler.mail_send
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mit:Mit6666.@172.18.0.2:5432/robux_republic_db
    networks:
      - reseau_partage

  ceiling_account:
    build: ./
    container_name: ceiling_account
    command: python -m app.schelduler.ceiling_account
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://mit:Mit6666.@172.18.0.2:5432/robux_republic_db  
    networks:
      - reseau_partage

networks:
  reseau_partage:
    external: true
    name: global_network