services:
  backend:
    image: ghcr.io/djelines/robux_republic/backendbank:latest
    container_name: fastapi_app
    restart: always
    ports:
      - "6682:8000"
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "1001:1001"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; r = urllib.request.urlopen('http://localhost:8000/health'); exit(0 if r.status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - reseau_partage

  scheduler_finalize:
    build: ./
    container_name: scheduler_finalize
    command: python -m app.schelduler.finalize_transaction
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    networks:
      - reseau_partage

  mail_send:
    build: ./
    container_name: mail_send
    command: python -m app.schelduler.mail_send
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    networks:
      - reseau_partage

  ceiling_account:
    build: ./
    container_name: ceiling_account
    command: python -m app.schelduler.ceiling_account
    restart: always
    env_file: .env
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    networks:
      - reseau_partage

networks:
  reseau_partage:
    external: true
    name: global_network
